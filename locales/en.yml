NAME: "Qingluan Compiler"
DESCRIPTION: "Compile the source code of the Qingluan project"
PACKAGE_MANAGER: "QingLuanPackageManager"
AUTHOR: "PRC.Song_MoJing <Song_Mojing@outlook.com>"
ARGS:
    usage_title: "Usage"
    usage_content: "%{app} [project_path] <options>"
    about_author: "Authors"
    params: "Parameters"
    options: "Options"
    help: "Print Help"
    version: "Print Version"
    author: "Print Author"
    project_path: "Project path"
    package: "Output type [def:%{package}]"
    os: "Target os [def:%{os}]"
    language: "Default console output language [def:%{language}]"
log:
    Err:
        TYPE: "error"
        Args:
            Error: "Args Error: %{message}"
            LanguageFormat: "Invalid language formatting: %{language}"
            Package: "Invalid output type: %{package}"
            ProjectPath: "Project path \"%{path}\""
        CompileError: "Compilation error"
        NotFound: "does not exist"
        PermissionDenied: "Insufficient permissions"
        AlreadyExists: "Already Exists"
        InvalidData: "Data errors"
        BrokenPipe: "The pipe is damaged"
        NotConnected: "Not connected"
        ConnectionRefused: "The connection is denied"
        ConnectionReset: "The connection is reset"
        ConnectionAborted: "The connection is aborted"
        TimedOut: "Connection timeout"
        Interrupted: "The operation is interrupted"
        WriteZero: "Write zero bytes"
        UnexpectedEof: "Unexpected file ends"
        InvalidInput: "Invalid input"
        NotADirectory: "Not a table of contents"
        IsADirectory: "Is the table of contents"
        ReadOnlyFilesystem: "Read-only file system"
        FileTooLarge: "The file is too large"
        TooManyLinks: "Too many links"
        Other: "Other errors"
        unknown: "Unknown error"
        LexError:
            InvalidChar: "Unexpected characters"
            UnclosedString: "The string is not closed"
            InvalidUnicode: "Invalid Unicode characters"
            MalformedNumber: "Invalid numbers"
            UnexpectedEof: "Unexpected file ends"
            InvalidEscape: "Invalid escape characters"
            MalformedChar: "Invalid characters"
        ParseError:
            UnexpectedToken: "Unexpected '%{token}', expect %{expect}"
            UnexpectedEnd: "Unexpected file ends"
    Warn:
        TYPE: "warning"
